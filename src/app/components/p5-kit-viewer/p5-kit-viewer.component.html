<div class="viewer-host" #host>
  <div class="viewer-controls">
    <button type="button" class="ctrl-btn" (click)="rotateLeft()" title="Rotar izquierda">
      <span class="material-symbols-outlined">rotate_left</span>
    </button>
    <button type="button" class="ctrl-btn" (click)="rotateRight()" title="Rotar derecha">
      <span class="material-symbols-outlined">rotate_right</span>
    </button>
  </div>
</div>
