<div class="auth-container">
    <div class="auth-left">
        <div class="image-wrapper">
            <img src="login.png" alt="Imagen Login" class="neon-image" />
        </div>
        <div class="brand-text">ROBOTECH_ACADEMY</div>
    </div>

    <div class="auth-right">
        <div class="auth-card">
            <div class="auth-header">
                <h1>PORTAL DE ACCESO</h1>
                <p class="subtitle">SYSTEM_LOGIN // V2.4.1</p>
            </div>

            <form class="auth-form" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <label>CORREO_ELECTRÓNICO [EMAIL]</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                            </path>
                        </svg>
                        <input
                            type="email"
                            name="email"
                            [(ngModel)]="email"
                            placeholder="enter_credentials..."
                            autocomplete="username"
                        />
                    </div>
                </div>

                <div class="form-group">
                    <label>CLAVE_DE_ACCESO [CONTRASEÑA]</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                            </path>
                        </svg>
                        <input
                            type="password"
                            name="password"
                            [(ngModel)]="password"
                            placeholder="********"
                            autocomplete="current-password"
                        />
                    </div>
                    <div class="forgot-link">
                        <a href="javascript:void(0)">¿OLVIDASTE TU CONTRASEÑA?</a>
                    </div>
                </div>

                <div class="temp-admin-box">
                    <p class="temp-admin-title">ADMIN TEMPORAL</p>
                    <p><strong>Email:</strong> {{ temporaryAdmin.email }}</p>
                    <p><strong>Clave:</strong> {{ temporaryAdmin.password }}</p>
                </div>

                @if (errorMessage) {
                    <p class="error-message">{{ errorMessage }}</p>
                }

                <button class="submit-btn" type="submit">
                    INICIAR SESIÓN
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                    </svg>
                </button>

                <div class="register-link">
                    <p>¿AÚN NO ESTÁS REGISTRADO?</p>
                    <a routerLink="/register">CREAR UNA CUENTA</a>
                </div>
            </form>
        </div>
    </div>

    <div class="language-selector">
        <div class="lang-option active">ES</div>
        <span class="lang-divider">/</span>
        <div class="lang-option">EN</div>
        <div class="lang-icon">🌐</div>
    </div>
</div>
