<div class="auth-container">
  <div class="auth-box">
    <div class="auth-left">
      <div class="top-left">ACADEMIA_ROBOTECH</div>
      <div class="image-wrapper">
        <img src="register.png" alt="Imagen Registro" class="neon-image" />
      </div>
      <div class="bottom-bar">
        <span class="monitor-text">MONITOR_SIS // ACTIVO</span>
        <span class="secure-link"><span class="dot"></span> ENLACE_SEGURO</span>
      </div>
    </div>

    <div class="auth-right">
      <div class="top-right-header">
        <div class="header-status">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="status-icon">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
          </svg>
          <span>INICIALIZAR_REGISTRO // V2.4.1</span>
        </div>
        <div class="language-selector">
          <span class="lang-option active">ES</span>
          <span class="lang-divider">|</span>
          <span class="lang-option">EN</span>
        </div>
      </div>

      <div class="auth-header">
        <h1>ACCESO<br>CONCEDIDO.</h1>
        <p class="subtitle">Establezca sus credenciales para acceder al<br>entorno de simulación.</p>
      </div>

      <div class="auth-form">
        <div class="form-group">
          <label>NOMBRE_COMPLETO [IDENTIFICADOR]</label>
          <div class="input-wrapper">
            <input type="text" placeholder="Ingrese designación alfanumérica" />
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="7" r="4"></circle>
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path>
            </svg>
          </div>
        </div>

        <div class="form-group">
          <label>CORREO_ELECTRÓNICO [EMAIL]</label>
          <div class="input-wrapper">
            <input type="email" placeholder="Ingrese dirección de enrutamiento" />
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </div>
        </div>

        <div class="form-group">
          <label>CLAVE_DE_ACCESO [CONTRASEÑA]</label>
          <div class="input-wrapper">
            <input type="password" placeholder="..............." />
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0110 0v4"></path>
            </svg>
          </div>
        </div>

        <div class="form-group">
          <label>CONFIRMAR_CLAVE [RE-INGRESAR CONTRASEÑA]</label>
          <div class="input-wrapper">
            <input type="password" placeholder="..............." />
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0110 0v4"></path>
            </svg>
          </div>
        </div>

        <button class="submit-btn">
          CREAR CUENTA
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"></path>
          </svg>
        </button>

        <div class="login-link">
          <a routerLink="/login">Ya tengo una cuenta <svg
              style="display:inline; width:12px; height:12px; margin-left:4px" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"></path>
            </svg></a>
        </div>
      </div>
    </div>
  </div>
</div>
