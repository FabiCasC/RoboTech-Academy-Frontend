<div class="projects-container">

    <!-- HEADER -->
    <div class="projects-header">
        <div class="header-content">
            <h1 class="page-title">DASHBOARD</h1>
            <div class="tabs-container">
                <button class="tab" routerLink="/proyectos" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">PROYECTOS</button>
                <button class="tab" routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">CURSOS</button>
            </div>
        </div>
        <div class="status-pill">
            <span class="status-dot"></span>
            SYS.STATUS: ONLINE
        </div>
    </div>

    <!-- CONTENT GRID -->
    <div class="content-grid">

        <div class="projects-list">
            <a *ngFor="let p of items" class="project-card" [routerLink]="['/proyectos', p.id]">
                <div class="card-header">
                    <div class="pill-row">
                        <span class="mini-pill" [class.course]="p.kind === 'COURSE'">{{ p.kind === 'COURSE' ? 'CURSO' : 'LIBRE' }}</span>
                    </div>
                    <span class="card-id">ID: {{ p.id }}</span>
                </div>

                <div>
                    <div class="card-title">
                        {{ p.title }}
                    </div>
                    <p class="card-desc card-desc-clip">
                        {{ p.description }}
                    </p>
                </div>

                <div class="card-divider"></div>

                <div class="card-footer">
                    <div class="build-status">
                        <div class="build-label">
                            ESTADO
                            <span>{{ p.kind === 'COURSE' ? 'FIJO' : 'EDITABLE' }}</span>
                        </div>
                        <div class="progress-track">
                            <div class="progress-fill progress-fill-dim"></div>
                        </div>
                    </div>
                    <span class="btn-primary btn-link">ABRIR</span>
                </div>
            </a>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">

            <div class="panel-card">
                <div class="panel-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2v20M2 12h20" />
                    </svg>
                    NUEVO LAB LIBRE
                </div>

                <div class="form-stack">
                    <label class="form-label">TITULO</label>
                    <input class="form-input" [(ngModel)]="titleDraft" placeholder="Ej: Seguidor de linea v2"/>

                    <label class="form-label">DESCRIPCION</label>
                    <textarea class="form-input form-area" [(ngModel)]="descriptionDraft" placeholder="Objetivo del lab..."></textarea>

                    <button type="button" class="btn-primary form-btn" (click)="createFree()">CREAR</button>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                    RESUMEN
                </div>
                <div class="summary-grid">
                    <div class="summary-item">
                        <div class="summary-key">TOTAL LABS</div>
                        <div class="summary-val">{{ totalLabs }}</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-key">CURSOS</div>
                        <div class="summary-val">{{ courseLabs }}</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-key">LIBRES</div>
                        <div class="summary-val">{{ freeLabs }}</div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
