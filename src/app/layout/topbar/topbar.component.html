<header class="topbar">
  <div class="logo-wrap">
    <div class="logo">ROBOTECH_ACADEMY</div>
    @if (roleProfile) {
      <span class="topbar-role">{{ roleProfile.code }}-ROLE</span>
    }
  </div>

  @if (showLabTabs()) {
  <nav class="topbar-tabs">
    <button class="tab-btn" [class.tab-active]="activeTab === 'play'" (click)="setTab('play')">PLAY</button>
    <button class="tab-btn" [class.tab-active]="activeTab === 'debug'" (click)="setTab('debug')">DEBUG</button>
    <button class="tab-btn" [class.tab-active]="activeTab === 'save'" (click)="setTab('save')">SAVE</button>
  </nav>
  }

  <div class="topbar-actions">
    <button class="btn-3d">
      <span class="material-symbols-outlined" style="font-size: 16px;">view_in_ar</span>
      Cambiar a 3D
    </button>
    <button class="btn-simular">
      <span class="material-symbols-outlined" style="font-size: 16px;">play_arrow</span>
      SIMULAR
    </button>
    <button class="btn-logout" (click)="logout()">
      <span class="material-symbols-outlined" style="font-size: 16px;">logout</span>
      CERRAR SESION
    </button>
    <button class="btn-user" routerLink="/perfil">
      <span class="material-symbols-outlined">
        account_circle
      </span>
    </button>
  </div>
</header>
