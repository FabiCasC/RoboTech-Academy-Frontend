<div class="sidebar-wrapper">
  <div class="sidebar-header">
    <h2 class="app-title">RoboTech Academy</h2>
    @if (roleProfile) {
      <span class="role-badge">{{ roleProfile.code }}-ROLE</span>
    }
    <span class="version-badge">V1.0.2-BETA</span>
  </div>

  <nav class="sidebar-nav">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        [class.active]="isItemActive(item.path)"
        class="nav-item"
      >
        <span class="material-symbols-outlined nav-icon">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  @if (session) {
    <div class="sidebar-user">
      <span class="user-name">{{ session.displayName }}</span>
      <span class="user-role">{{ roleProfile?.label }}</span>
    </div>
  }
</div>
